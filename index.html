<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centered H1</title>
    <style>
        /* Import a custom font from Google Fonts */
        @import url('https://googleapis.com');

        /* Make the body fill the entire screen and use Flexbox */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            background-color: #5c0048; /* Optional page background */
        }

        /* Style the H1 element */
        h1 {
            color: white;
            background-color: #5c0048; /* Colored background */
            font-family: 'Montserrat', sans-serif; /* Custom font */
            font-size: 3rem;
            padding: 20px 40px;
            border-radius: 8px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Hi</h1>
</body>
</html
